name: pila
description: A mobile game to clear a field of digits referring to stacked tetrominos.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.1+1

environment:
  sdk: ^3.1.1

dependencies:
  flutter:
    sdk: flutter

  english_words: ^4.0.0
  provider: ^6.0.0
  scidart: ^0.0.2-dev.12
  sqflite: ^2.4.2
  path: ^1.9.1
  url_launcher: ^6.3.2
  logging: ^1.3.0
  logger: ^2.7.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  test: ^1.26.3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/tetrominos/
    - assets/images/icon/
    - assets/images/docs/

flutter_launcher_icons:
  android: true  
  ios: true  
  image_path: "assets/images/icon/pila-icon_minimal_orange_2.png"
  adaptive_icon_background: "assets/images/icon/pila-icon_minimal_orange_2_background.png"
  adaptive_icon_foreground: "assets/images/icon/pila-icon_minimal_orange_2_foreground.png"
