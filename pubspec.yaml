name: pila
description: A mobile game to clear a square field of digits using tetrominos.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.1+1

environment:
  sdk: ^3.1.1

dependencies:
  flutter:
    sdk: flutter

  english_words: ^4.0.0
  provider: ^6.0.0
  scidart: ^0.0.2-dev.12
  sqflite: ^2.4.2
  path: ^1.9.1
  url_launcher: ^6.3.2
  logging: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  test: ^1.26.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
